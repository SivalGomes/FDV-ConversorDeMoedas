<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas: Real para Dólar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .converter-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 12px;
            color: #95a5a6;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 16px;
            color: #2c3e50;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #2ecc71;
        }

        .result-box {
            background-color: #e8f8f5;
            border-left: 5px solid #2ecc71;
            padding: 15px;
            border-radius: 4px;
            margin-top: 25px;
            text-align: center;
        }

        .result-box p {
            color: #16a085;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
