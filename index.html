<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas: Real para Dólar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .converter-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 12px;
            color: #95a5a6;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 16px;
            color: #2c3e50;
            outline: none;
            transition: border-color 0.2s;
        }

        select{
            width:100%;
            padding:12px;
            border:1px solid #dcdde1;
            border-radius:6px;
            font-size:16px;
            color:#2c3e50;
            outline:none;
            transition:.2s;
        }

        select:focus{
            border-color:#2ecc71;
        }

        input[type="number"]:focus {
            border-color: #2ecc71;
        }

        .result-box {
            background-color: #e8f8f5;
            border-left: 5px solid #2ecc71;
            padding: 15px;
            border-radius: 4px;
            margin-top: 25px;
            text-align: center;
        }

        .result-box p {
            color: #16a085;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="converter-card">
        <h2>Conversor de Moedas</h2>
        
        <!-- Campo: Taxa de Câmbio -->
        <div class="input-group">
            <label for="exchange-rate">Taxa de Câmbio</label>
            <div class="input-wrapper">
                <span class="currency-symbol">R$</span>
                <input type="number" id="exchange-rate" value="5.50" step="0.01" min="0.01" placeholder="Ex: 5.50">
            </div>
        </div>

        <!-- Campo: Valor em Real -->
        <div class="input-group">
            <label for="brl-amount">Valor em Real (BRL)</label>
            <div class="input-wrapper">
                <span class="currency-symbol">R$</span>
                <input type="number" id="brl-amount" placeholder="Digite o valor" step="0.01" min="0">
            </div>
        </div>

        <!-- Seleção da moeda -->
        <div class="input-group">
            <label for="currency">Converter para</label>

            <select id="currency">
                 <option value="USD">Dólar (USD)</option>
                 <option value="EUR">Euro (EUR)</option>
         </select>
    </div>

        <!-- Painel de Resultado -->
        <div class="result-box">
            <p>Resultado Convertido</p>
            <div class="result-value" id="usd-result">$ 0,00</div>
        </div>
    </div>

    <script>
        // Selecionando os elementos do DOM
        const brlInput = document.getElementById('brl-amount');
        const rateInput = document.getElementById('exchange-rate');
        const usdResult = document.getElementById('usd-result');
        const currencySelect = document.getElementById('currency');

        const exchangeRates = {
            USD: 5.50,
            EUR: 6.40
        };

        // Função que realiza o cálculo da conversão
        function convertCurrency() {
            const brlValue = parseFloat(brlInput.value);
            const currency = currencySelect.value;

            rateInput.value = exchangeRates[currency];

            const rateValue = exchangeRates[currency];


            // Valida se os campos possuem números válidos e maiores que zero
           if (!isNaN(brlValue) && !isNaN(rateValue) && rateValue > 0) {

             const convertedValue = brlValue / rateValue;

             if (currency === "USD") {

                usdResult.textContent = convertedValue.toLocaleString('en-US', {
                     style: 'currency',
                     currency: 'USD'
                });

            } else if (currency === "EUR") {

                  usdResult.textContent = convertedValue.toLocaleString('de-DE', {
                    style: 'currency',
                    currency: 'EUR'
                });

            }

        } else {

             usdResult.textContent = "$ 0,00";

        }
    }

        // Adiciona ouvintes de evento para atualizar o resultado em tempo real enquanto o usuário digita
        brlInput.addEventListener('input', convertCurrency);
        rateInput.addEventListener('input', convertCurrency);
        currencySelect.addEventListener('change', convertCurrency);
    </script>

</body>
</html>
